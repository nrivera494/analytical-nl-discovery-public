name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Schema and independence rules
        run: python scripts/validate.py
      - name: Generated files are not edited in pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/check_generated.py "origin/${{ github.base_ref }}"
