  TOD; band yield eta_B (w >= w_z = 1/(6 delta3)), gated DW yield eta_DW (field zeroed by a smooth tanh gate
  |tau| < 15, width 1), Roy's NSR spectral-peak level, invariant drifts; each case at step h and h/2. lawfit.py: fit
  ln eta_DW = c + p ln delta3 - d/delta3 to the k smallest delta3 points; local slopes; error exponent.
