description: >-
  Linearized quantum noise of an unchirped Gaussian in normally dispersive single-mode fibre, pure Kerr (plus two
  self-steepening points). Full output quadrature covariance V by central differences of the split-step map in all
  2 Nt input directions (nd_cov.py); bound chain lambda_min(V), lambda_2(V) (added after the main grid; held-out set 2 only),
  lambda_pass (V restricted orthogonal to i*alpha), lambda_gen (count covariance C vs diag nbar over bins holding 1 - 1e-9
  of the photons); binary filters by three search stages (run_points.py: exhaustive intervals, flip descent from
  structured and 60 random starts, 400-step iterated local search; refine_binary.py: descent from roundings of a
  projected-gradient non-negative-weight solution, 1000-step ILS; transfer_binary.py: filters mapped between N at fixed
  z/z_wb via v = omega/N, descent + 1000-step ILS). analyze.py scores against the reduced curve of run
  2026-10-10-claude-b-nd-semiclassical (curve_N200.json if present, else N100, else N50) and writes summary.json and
  fig_bounds.png.
