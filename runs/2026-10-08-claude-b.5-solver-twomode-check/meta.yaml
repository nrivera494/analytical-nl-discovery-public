serves: "Independent-code (FastDifferentiableMMNLO) computation of the bandpassed all-mode photon-number Fano factor F in the two-mode incoherent cross-phase soliton model (LP01 = mode 1, LP02 = mode 2), for comparison with claude-b's numpy code (P-20261004-root-03, round 2). The numpy numbers were not looked at before summary.json was written."
description: >-
  Model (normalized soliton units): i a_z + a_tt/2 + (|a|^2+|b|^2) a = 0,
  i b_z + i delta b_t + b_tt/2 + (|a|^2 + C22 |b|^2) b = 0, equal beta2, no beta3,
  no Raman (NoRaman()), self-steepening suppressed (omega0 T0 = 1e6). Launch a =
  sqrt(p1/Sigma) sech, b = sqrt(p2/Sigma) sech, p1 + p2 = 1, Sigma = p1^2 + 2 p1 p2 +
  C22 p2^2. Readout N = sum over both modes and |k| <= kmax of the photon-unit
  spectrum, Omega_k = k 2pi/(40 T0), time window 40 T0 (the solver's centered
  frequency axis has a bin at Omega = 0; bins identified by rounding). F = Var(N)/<N>
  for linearized vacuum noise of coherent inputs, Var(N) = sum |dN/dconj(B(0))|^2
  from solve_adjoint(...; adjoint_mode=:discrete_rk4ip) on an RK4IP fixed-step
  Float64 forward solution, exactly as in example_notebooks/squeezing_spectral_filter.ipynb.
  Physical scaling: T0 = 1 ps, beta2 = -1 ps^2/m (L_D = 1 m), gamma = n2 omega0 S0/c
  = 1 /W/m (P0 = 1 W), S0 = 1e10 m^-2, n2 = gamma c/(omega0 S0).
  Two overlap tensors were run. (i) "exact tensor": S1111 = S0, S2222 = C22 S0,
  S1122 = S1212 = S2211 = S2121 = S0/2, and the two coherent elements S1221 =
  S2112 = 0, so that the solver's N_p = sum S[p,l,m,n] A_l A_m conj(A_n) is exactly
  the incoherent XPM model (no Delta beta0 needed; kappa = 0); dz = 5e-4 L_D, Nt = 256.
  These are the reported numbers. (ii) "specified tensor": all two-1/two-2
  elements S0/2 as in the task, coherent terms suppressed by a mode-2 offset
  kappa = Delta beta0 L_D = 1e3 and 2e3 (TaylorBeta row 1), dz = 0.1/kappa L_D
  (2 kappa dz = 0.2); these deviate from (i) by O(1/kappa) and are reported as a
  measurement of that deviation.
