caveats:
  - "The reported F values use the exact tensor (S1221 = S2112 = 0, kappa = 0), not the specified symmetric tensor with Delta beta0. The specified tensor converges to them as 1/kappa (shown above), but at kappa = 1e3 and 2e3 it differs by up to 1.1e-4 and 4.0e-5 in F; relative to |dF| that is 0.04-1.4 (kappa = 1e3) and 0.014-0.39 (kappa = 2e3) in case 2, up to 6.4 and 1.7 in case 6 (p2 = 0.1), 0.001-0.10 in case 4 and 0.003-0.022 in case 5; so the task's acceptance test 'doubling Delta beta0 does not change the numbers at 7 digits' fails for any affordable kappa (the step must resolve 2 kappa, cost proportional to kappa). Specified-tensor numbers for all cases at kappa = 1e3 and 2e3 are in summary.json; their naive Richardson extrapolation 2F(2kappa) - F(kappa) is not reliable because the 1/kappa coefficient depends on the end phase 2 kappa zeta mod 2pi."
  - "F is the linearized (first-order) vacuum-noise Fano factor. At p2 = 0 the mode-2 vacuum contributes exactly zero to Var(N) in this approximation."
  - "Self-steepening cannot be switched off in MMGNLSEParameters: the nonlinear prefactor is always n2 (omega0 + Omega)/c. It was suppressed with omega0 T0 = 1e6 (a numerical device, not a physical carrier); the residual effect on F is 0.8 s^2 < 1e-12, and the photon weights 1/(hbar(omega0+Omega)) are uniform to 2e-5."
  - "The time window is fixed at 40 T0 by the required bin spacing, so no window-size convergence test was made (changing the window would move the band edges). The launched sech is 4e-9 of its peak amplitude at the window edge. The soliton is centred on the grid point t = 0."
  - "The solver multiplies the nonlinear term by damped_freq_window(Nt), which tapers only positive detunings above about 0.4 of Nyquist (Omega T0 > 8.3 at Nt = 256; 0.9995 at 0.8 Nyquist, 0.04 at Nyquist) and leaves negative detunings untouched. Irrelevant here (Nt = 512 changes F by <= 2.5e-12) but asymmetric."
  - "dF for cases 5 and 6 uses the case-2 p2 = 0 point as F(0); with b = 0 the result does not depend on C22 or delta (the C22 = 1 and C22 = 0.5 p2 = 0 points agree to all digits)."
  - "Other agents' Julia jobs ran on the same machine; timings are indicative only."
