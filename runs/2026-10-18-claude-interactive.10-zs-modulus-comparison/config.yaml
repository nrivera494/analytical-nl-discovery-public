command: "~/agent-work/venv/bin/python check.py   # writes summary.json"
method: "Fourier collocation of L = [[i d/dt, -i q], [-i conj(q), -i d/dt]] (ZS convention of the claim card), dense eigenvalues"
window_length: 40.0
grids: [384, 576]
im_min: 0.02
two_grid_match_tol: 1.0e-3
