  random_complex: "10 draws: sum of 3 Gaussians with complex amplitudes N(0,1.2)+iN(0,1.2), centres U(-3,3), widths U(0.6,1.6)"
compared: "eta_max(q) versus eta_max(|q|), both from the same collocation"
