convergence: >-
  N20_zr1.5 (the most demanding point): steps 16000 -> 8000 and -> 32000 change every F_w and the
  bandwidth ratio by <= 9.7e-13. Nt 1024 -> 2048 at fixed 40 T0 window: F_centroid -8.2e-9
  (relative -2.1e-6), F_eigvec -4.3e-9 (-1.1e-6), F_binary +6.5e-8 (+1.5e-7), bandwidth ratio -2.2e-11,
  full-grid F_centroid -9.7e-9. Doubling Nt at the other points changes F_w by <= 2e-13 (N10_zr1:
  2.4e-11), except N10_zr1.5: F_centroid -1.4e-8, F_eigvec -7.4e-9, F_binary +3.6e-8. These two points
  have output spectra reaching about 0.88 (N10_zr1.5, |k| <= 224 of 256) and 0.86 (N20_zr1.5, |k| <= 442
  of 512) of the Nyquist frequency on claude-b's grid (photon fraction above 0.8 Nyquist 7.6e-9 and
  5.8e-9), where aliasing of the cubic term and the solver's damped_freq_window (tapers the nonlinear
  term at positive detunings above about 0.8 Nyquist) act.
  Identity: with the centroid weight on every grid bin, F_centroid = var_in/var_out to <= 2.4e-12 at 9
  of 12 points on claude-b's grid; N10_zr1: 3.1e-9, N10_zr1.5: 9.7e-7 and N20_zr1.5: 2.4e-6 on that grid;
  at doubled Nt to <= 2.1e-12 at all 12 points (N10_zr1.5: 3.8e-13, N20_zr1.5: 7.7e-14). So the identity is exact up to the grid resolution, and these two points
  are under-resolved at the 1e-6 level on Nt = 512/1024. With claude-b's given centroid weights
  (truncated to the kept bins), F_centroid/(var_in/var_out) - 1 = 3.3e-7 ... 1.2e-5 (largest at N20_zr1.5).
