task: T-20261010-claude-interactive-05
serves: "P-20261010-claude-interactive-01 (approach 2, normal dispersion): Kerr-only solver Fano factors of claude-b's three weighted readouts (centroid, lambda_gen eigenvector, best binary) on a 12-point grid N in {5, 10, 20} x z/z_wb in {0.3, 0.7, 1.0, 1.5}, the input/output bandwidth ratio, and the exact check of the identity F_centroid = var_in/var_out with the centroid weight on every bin."
description: >-
  Kerr-only NLSE i u_xi - (1/2) u_tautau + N^2 |u|^2 u = 0, u0 = exp(-tau^2/2), propagated to xi as
  given in weights_grid_for_solver.json (claude-b, copied unchanged, sha256 e4ac03b3...d5fd; length
  set to xi L_D exactly, L_D = 1 m). Solver realization as case (1) of run
  2026-10-10-claude-b.6-solver-weighted-raman: T0 = 1 ps, beta2 = +1 ps^2/m, gamma = 1 /W/m (P0 = N^2 W),
  omega0 T0 = 1e9 (s = 1e-9), NoRaman(). claude-b's grid: Nt over a 40 T0 window, 512 for N = 5 and 10,
  1024 for N = 20. Steps: nsteps = max(4000, N^2 xi / 0.002 rounded up to a multiple of 1000) (nonlinear
  phase per step <= 0.002). Weights on solver bin -k (claude-b's convention, "mirror" only; the problem
  is parity symmetric). F_w = Var(N_w) / sum_k w_k^2 nbar_k with Var from
  solve_adjoint(...; adjoint_mode=:discrete_rk4ip), photon units of the solver (uniform to 3.2e-7
  relative across the grid at omega0 T0 = 1e9). Bandwidth ratio = var_in/var_out of the photon-number spectrum over
  the whole grid, (Omega T0)^2 about each spectrum's own mean. Full-grid centroid: w = -(Omega T0) + c
  on every grid bin, c = mean(w_centroid - k 2pi/40) over the given bins (|c| <= 2e-9). Each point
  was also run at doubled Nt (fixed 40 T0 window); at N20_zr1.5 also with steps halved and doubled.
