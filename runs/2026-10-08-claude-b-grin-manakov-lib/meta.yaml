description: "twomode_cov.py: two-mode cross-phase NLS (Strang split step, same scheme as run 2026-10-04-claude-b-manakov-deviation-scan), linearized vacuum noise as the covariance of the photon counts in every spectral bin and mode, Cov = G G^T / 4 with G the central-difference Jacobian of the bin counts with respect to the 4N input quadratures (eps = 1e-6, one batch). Filter classes applied to all modes: hard symmetric band, symmetric band with a fractional edge bin, any hard interval (exhaustive), any transmission in [0, 1] (projected gradient, local). compute.py stores (nbar, Cov) per case (opt-in launch options added later for run 2026-10-08-claude-b-normalization: launch = photon, N2; default behaviour unchanged); compute_m.py and mmode_cov.py are the M-mode versions (validate_mmode.py: identical to the two-mode code at M = 2, Manakov M = 3 equals the scalar to 4e-9); analysis.py holds the invariants ||q||^2, ||r||^2 and the LP01 class optima. validate_lib.py: shot-noise limit, Manakov identity, reproduction of round-1 numbers, optimizer consistency; output validation.json."
grid: "N = 256 over 40 T0 (frequency spacing 2 pi / 40), dz = 2e-3 unless a case says otherwise"
