# Run 2026-10-04-claude-b.4-pmin-gdd0-check (task T-20261004-claude-interactive-03, diagnostic added after the map).
# Identical to run 2026-10-04-claude-b.4-pmin-length-map except that the assumed input GDD is set to zero
# (transform-limited input with the same measured spectrum). Purpose: test whether the input pre-chirp
# (C = GDD/T0^2 = -2.4 in the archive configuration) causes the two departures from the card's crossover picture
# seen in the map: no minimum below F = 0.99 at 0.25 m, and the deeper minimum at 5 m.
# This diagnostic was not pre-registered in the frozen note; it was decided after seeing the map.
# Driver: run_map.jl (same adaptive procedure as the map; RUN_ID changed). No random numbers; no seed.

