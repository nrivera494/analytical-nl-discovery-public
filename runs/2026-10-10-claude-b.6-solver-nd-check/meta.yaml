convergence: >-
  Case A (relative to Nt = 512, 4000 steps, omega0 T0 = 1e6): 1000, 2000, 8000, 16000 steps change F
  by at most 1.2e-10, 8.1e-12, 6.0e-13, 8.8e-13; Nt = 1024 and 2048 at fixed 40 T0 window by at most
  2.8e-13. Self-steepening residual: F(T) - F(-T) = +1.469e-6, +1.469e-7, +1.469e-8, +1.469e-9 (N10
  binary) at omega0 T0 = 1e6, 1e7, 1e8, 1e9 (exactly O(s)); the mirror mean at 1e6 and at 1e9 agree to
  2.2e-10 (N10 binary), i.e. O(s^2). The N20 interval filter is symmetric (bins -42..42), so filter =
  mirror. Steps: xi_L/4000 = 1.86e-5 L_D (N = 10) and 3.97e-6 L_D (N = 20).
  Case B_ss: 8000 steps change F by <= 3.4e-12; Nt = 1024 and 2048 by <= 1.7e-11. B_noss reproduces
  case A at omega0 T0 = 1e6 to 8.6e-13 (unit handling). Photon number with self-steepening conserved
  to 2.1e-13 (B_ss) and 2.3e-13 (C).
  Case C (relative to Nt = 2048, 4000 steps): 2000 and 8000 steps change F_C1 by <= 8.6e-12 and the
  Raman variance/N by <= 2.7e-9. The Raman kernel is sampled at t_n = n dt with a kink at t = 0, so
  F converges as dt^2: binary filter F_C1 = 0.4717384 (Nt 1024, dt 3.9 fs), 0.4730324 (2048), 0.4733621
  (4096), 0.4734449 (8192); successive-difference ratios 3.92 and 3.98 (all filters and quantities:
  3.66-4.03); Richardson (dt^2) values from (2048, 4096) and (4096, 8192) agree to <= 5.2e-7 for every
  reported quantity. The dt -> 0 values in summary.json headline use (4096, 8192); Nt = 8192 used 2000
  steps (dz converged to 1e-11 at Nt = 2048).
  Adjoint versus central finite differences of the forward map (fixed random directions, photon
  units): case A N10, eps = 0.01: 3.7e-10, 4.0e-9; case C (Raman + self-steepening, N_T ~ 1.2e10):
  eps = 0.01: 1.7e-6, 2.5e-5; eps = 1: 4.8e-8, 1.2e-7; eps = 3: 1.8e-9, 1.7e-8 (the eps = 0.01 numbers
  are limited by rounding of N_T, error ~ 1/eps).
