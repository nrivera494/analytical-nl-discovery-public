post_freeze: >-
  Everything in this block was done after summary.json was hashed and does not change it
  (summary.json sha256 still 3c6879c7...4803; results.jsonl sha256 still 46bf7f0a...faa4).
  (1) Read runs/2026-10-10-claude-b-nd-oracle/nd_cov.py for conventions only: its spectrum is
  numpy fft(u), the coefficient of exp(+i w t), while the solver's is the coefficient of
  exp(-i Omega t); both time-domain equations carry self-steepening as (1 + i s d/dtau)(|u|^2 u).
  So claude-b's bin k is the solver's bin -k: for cases B and C the solver 'mirror' entries are the
  ones with claude-b's filters as claude-b applies them. Its photon counting is uniform in frequency.
  (2) Added stages post_B_ss_uniform (s = 1/121.526) and post_B_ss_uniform_s0082 (s = 0.0082):
  self-steepening dynamics with photon counting and input vacuum uniform in frequency (Omega = 0
  photon weight), Nt = 512, 4000 steps (8000 steps change F by <= 3.2e-12). F, solver labels
  filter(+k)/mirror(-k): binary 0.465608/0.449802, interval 0.734734/0.729874 (s = 1/121.526);
  binary 0.465539/0.449785, interval 0.734691/0.729851 (s = 0.0082). Records in results_postfreeze.jsonl.
  (3) Compared with claude-b's covariance matrices (~/analytical-nl-discovery-data/2026-10-10-claude-b-nd-oracle/
  N10_zr0.7.npz, N20_zr0.3.npz, N10_zr0.7_ss0.0082.npz; F = 1^T C_T 1 / sum nbar_T), opened for the
  first time after the freeze. Case A, numpy minus solver F_s0: N10 binary +4.2e-7, N10 interval +1.4e-6,
  N20 binary +9.7e-8, N20 interval +4.3e-7. Self-steepening, uniform weights, same physical bins,
  s = 1/121.526: binary -4.2e-5 (claude-b's bins as given) and -5.0e-6 (its mirror), interval -6.3e-5
  (as given; its mirror lacks 20 bins in the npz). With s = 0.0082 the differences are -2.5e-5, +6.5e-5,
  -4.0e-5, so rounding s does not explain them. The solver numbers are converged to <= 2e-11, so the
  differences presumably come from the numpy discretization; the numpy code was not run here.
  run_nd.jl was edited after the freeze only to add the two post_ stages and to make the results
  path a Ref (post_ stages write to results_postfreeze.jsonl); the pre-freeze stages are unchanged.
