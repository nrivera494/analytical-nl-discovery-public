description: >-
  Scalar single-mode NLSE in normal dispersion, i u_xi - (1/2) u_tautau + N^2 |u|^2 u = 0,
  u(tau,0) = exp(-tau^2/2), z = zr * xi_wb(N) * L_D with xi_wb(N) = 1/sqrt(4 N^2 e^{-3/2} - 1).
  Readout: photon number in the binary filters of filters_for_solver.json (copied from
  runs/2026-10-10-claude-b-nd-oracle/, sha256 0e06d602...f7d), bin k meaning Omega T0 = k 2pi/40 on
  the solver's centered frequency axis (window 40 T0; the axis has a unique Omega = 0 bin and every
  bin lies on k 2pi/window to 1e-9; bins identified by rounding). F = Var(N_T)/<N_T> for linearized
  vacuum noise of the coherent input, Var = sum |dN_T/dconj(B(0))|^2 from
  solve_adjoint(...; adjoint_mode=:discrete_rk4ip) on a fixed-step RK4IP Float64 forward run with
  equal adjoint step, as in example_notebooks/squeezing_spectral_filter.ipynb. Every point was also
  run with the mirrored filter (bins -k), because the solver's Omega is the physical detuning
  omega - omega0 (A(t) = sum_k A_k exp(-i Omega_k t), positive Omega = higher optical frequency) and
  self-steepening and Raman break the Omega -> -Omega symmetry.
  Case A (Kerr only): T0 = 1 ps, beta2 = +1 ps^2/m, gamma = 1 /W/m (L_D = 1 m, P0 = N^2 W),
  NoRaman(), self-steepening suppressed by omega0 T0 = 1e6 (also 1e7, 1e8, 1e9). Points N = 10,
  zr = 0.7 (key N10_zr0.7) and N = 20, zr = 0.3 (key N20_zr0.3). Nt = 512 over 40 T0, 4000 steps
  (dz = xi_L/4000 L_D). Reported Kerr-only value F_s0 = mean of filter and mirrored filter at
  omega0 T0 = 1e9 (parity maps (T, s) to (-T, -s) with s = 1/(omega0 T0), so the mean is F(s = 0) + O(s^2)).
  Case B: beta2 = 0.020 ps^2/m, gamma = 0.010 /W/m, T0 = 0.100 ps (L_D = 0.5 m), N = 10 (P0 = 20 kW),
  z = 0.7 xi_wb(10) L_D = 0.0372568 m (xi_L = 0.0745136), NoRaman(). B_ss: self-steepening on, omega0 = 2pi c/1550 nm
  (omega0 T0 = 121.526), photons counted at the physical carrier. B_noss: omega0 T0 = 1e6 (n2 rescaled
  to keep gamma), solver photon weights (uniform) -- the same dimensionless problem as case A. Extra
  decomposition B_noss_physical_photon_weights: B_noss dynamics, but observable and input vacuum in
  photon units at the physical 1550 nm carrier (filter multiplied by w_phys/w_run, sensitivity
  divided by sqrt(w_phys)); it separates the photon-energy weighting from the self-steepening
  dynamics. Nt = 512, 4000 steps.
  Case C: as B_ss with raman = AgarwalRaman() (fraction 0.18, tau1 = 12.2 fs, tau2 = 32 fs; the
  model the squeezing notebook passes to MMGNLSEParameters), Nt = 2048 over 4 ps (dt = 1.95 fs),
  4000 steps, forward and adjoint saved at every step. C1: deterministic delayed response, F from
  input vacuum only. C2: Raman Langevin variance by the notebook contraction
  B = -2 Im(A conj(lambda)) (power units), Var_R = gamma^2 sum_z w_z sum_omega |ifftshift(ifft(B))|^2 C(omega) df,
  with C(omega) from raman_langevin_spectrum_coth (symmetrized coth(hbar|omega|/2kT) spectrum,
  300 K; copied verbatim from solver branch task/T-20261004-gpt-b-02, commit d79f150,
  example_notebooks/raman_bath_spectrum.jl, sha256 cc621d0f...f31f). Reported variants: z weights
  trapezoid ("trap", primary) and the notebook's nominal-dz rectangle ("rect"); "notebook" (noise
  injected as i gamma A m, as in the notebook) and "ssweight" (noise injected through the solver's
  full nonlinear prefactor (1 + Omega/omega0) * damped_freq_window, i.e. with the same
  self-steepening operator as the delayed Kerr term); spectra coth 300 K, coth 0 K (zero point
  only) and the legacy solver spectrum at 300 K (comparison only; not used for results).
  Raman-kernel sampling converges as dt^2, so C was repeated at Nt = 1024, 4096 and 8192 and
  extrapolated (Richardson, dt^2).
