caveats:
  - "Bin sign convention. Filter bins were applied as Omega T0 = +k 2pi/40 with Omega the physical detuning (solver convention, positive = blue). If claude-b's numpy code uses the opposite sign (e.g. u(t) = sum U exp(+i Omega t)), the 'mirror' entries are the ones that correspond to its filters in cases B and C. Case A is parity symmetric and does not depend on this (filter and mirror agree to O(s))."
  - "Case A at omega0 T0 = 1e6 (the value suggested in the task) leaves an O(s) = O(1e-6) self-steepening/photon-weight residual that changes the 6th digit for the asymmetric filters (0.451337 vs 0.451336, 0.727378 vs 0.727380, 0.453441 vs 0.453438). The Kerr-only values are F_s0 (mirror mean at omega0 T0 = 1e9); both are in summary.json."
  - "Self-steepening cannot be switched off in MMGNLSEParameters: the nonlinear prefactor is n2 (omega0 + Omega)/c and the photon weights are 1/(hbar(omega0 + Omega)), both set by omega0. 'Self-steepening suppressed' therefore also makes photon counting uniform in frequency. With T0 = 0.1 ps the band of the filters spans |Omega| <= 0.18 omega0, so photon counting at the physical carrier alone changes F by up to 0.018 (B_noss_physical_photon_weights); the self-steepening dynamics account for the rest of B_ss - B_noss."
  - "Case C at the specified grid (Nt = 2048, dt = 1.95 fs) is not converged to 6 digits: the deterministic Raman response converges as dt^2, and F_C1(dt -> 0) - F_C1(Nt = 2048) = +4.4e-4 (binary), -1.6e-4 (binary mirror), +2.5e-4 (interval), -8.5e-5 (interval mirror). Both the Nt = 2048 numbers and the dt -> 0 extrapolations are reported. varR/N changes by at most 4.3e-5 (absolute; 1.1e-3 relative, binary mirror) from Nt = 2048 to 8192."
  - "The Raman Langevin contraction was not checked against a Monte Carlo in this run (the gpt-b branch did that for the notebook cases, without self-steepening on the noise term). The notebook formula injects the noise as i gamma A m without the self-steepening operator; injecting it through the solver's full nonlinear prefactor (ssweight) changes varR/N by -3.5% (binary), -3.0% (binary mirror), +4.4% (interval) and -10.9% (interval mirror). I regard ssweight as the consistent choice when self-steepening is on, but this is a modelling statement, not a check."
  - "Legacy solver spectrum PulsePropagation.raman_langevin_spectrum (not used for results): coth/legacy variance ratio 1.27 (binary filter), 1.25 (binary mirror), 1.34 (interval), 1.35 (interval mirror) at Nt = 2048. Zero-point part alone (coth at 0 K): 43%, 40%, 51%, 52% of the 300 K variance."
  - "At Nt >= 2048 with T0 = 0.1 ps the frequency grid extends past Omega = -omega0 (Nyquist 1608 rad/ps at Nt = 2048 vs omega0 = 1215 rad/ps). Those bins have zero photon weight and a negative self-steepening prefactor; the field there is below 1e-30 of the energy, so this has no effect here, but it would in a broader-band problem."
  - "F is the linearized (first-order) vacuum-noise Fano factor; no beyond-linear corrections are included. Mean photon numbers are 7.2e5-6.5e6 (case A, omega0 T0 = 1e6, arbitrary units of the soliton-unit realization) and 1.2e10-1.9e10 (cases B, C)."
  - "Other agents' Julia jobs ran on the same machine; timings are indicative only."
