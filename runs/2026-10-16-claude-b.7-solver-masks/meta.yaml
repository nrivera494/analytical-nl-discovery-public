results: >-
  Primary (TW 70, Nt 1024, 8000 steps, omega0 T0 = 1e6): TL eta_B = 0.16429435, eta_G = 0.13033039;
  phase eta_B = 0.22945044, eta_G = 0.032146954; passive eta_B = 0.24594767, eta_G = 2.7509887e-5,
  passive input energy 0.99916482 of the laser. At omega0 T0 = 1e8: TL 0.16429223 / 0.13032828,
  phase 0.22944792 / 0.032146282, passive 0.24594521 / 2.7509465e-5.
convergence: >-
  Steps 2000 -> 8000: eta_B <= 1.7e-7, eta_G <= 5.2e-6 (phase); 4000 -> 8000: <= 2.9e-9 and 2.8e-7.
  Nt 1024 -> 2048 (TW 70): <= 3.6e-10 (eta_B), <= 6.0e-7 (eta_G). Window TW 70 -> 140 -> 280 with an
  identical input field: eta_G changes <= 8.5e-9 (TL, phase) and -4.7e-4 then -1.5e-5 (passive);
  eta_B changes -1.4e-3 then -6.7e-4 (TL), -1.3e-3, -6.5e-4 (phase), -2.0e-3, -1.0e-3 (passive):
  this is the band-edge discretization (bin width 2pi/TW at w_z = 3.33, where the spectrum is
  strong), not the window; the fractional-edge band sums change by -1.1e-4, -2.3e-5 (TL),
  -2.9e-5, -5.9e-6 (phase), -1.0e-4, -2.1e-5 (passive), and give the grid-converged values
  0.16462, 0.22989, 0.24668. (Values are X(first-named)/X(second-named) - 1.) Mask
  representation: applying the mask by linear interpolation on 2pi/140 bins instead changes eta_B
  by +8.8e-4 (phase), -7.9e-4 (passive) and eta_G by +2.8 % (phase), +12.5 % (passive), so the
  optimized gated yields are specific to the 2pi/70 bin representation of the mask.
comparison_with_claude-b: >-
  relative difference claude-b / solver - 1 on the same grid. omega0 T0 = 1e6 (8000 steps):
  eta_B -1.19e-5 (TL), -1.04e-5 (phase), -9.5e-6 (passive); eta_G -1.27e-5 (TL), +1.15e-5 (phase).
  omega0 T0 = 1e8 (self-steepening residual removed; 8000 steps): eta_B +9.9e-7, +5.6e-7, +5.4e-7;
  eta_G +3.5e-6 (TL), +3.2e-5 (phase); at claude-b's own step (2000) +2.7e-5 for the phase eta_G.
  Passive energy kept agrees to 2e-16 and the phase-mask input peak power to all printed digits (0.36054661054713),
  so the masks are applied identically. claude-b gave no gated passive value. The remaining
  3e-5 in the gated phase-mask yield is above the solver's step error for that number (5e-6 at
  h = 0.001, 2.8e-7 at h/2 vs h/4) and is not explained here; a gated h/2 value from the numpy
  code would show whether it is that code's step error.
