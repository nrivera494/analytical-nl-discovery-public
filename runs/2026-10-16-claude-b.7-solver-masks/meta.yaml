task: T-20261016-claude-interactive-03
serves: >-
  P-20261016-claude-interactive-01: solver evaluation of claude-b's optimized input masks (phase-only
  and passive amplitude+phase) for the DW band yield, model M0, Gaussian laser, N = 3, delta3 = 0.05,
  xi_f = 2 (item 6 requested by claude-b on 2026-10-16 ~12:28 EDT), as an independent check of
  claude-b's numpy values in runs/2026-10-16-claude-b-dw-shaping/opt_N3_d0.05_xi2.json.
description: >-
  Model and solver mapping as in run 2026-10-16-claude-b.7-solver-dwyield (dw_lib.jl copied
  unchanged): L_D = 1 m, T0 = 1 ps, beta2 = -1 ps^2/m, beta3 = 0.3 ps^3/m, gamma = 1 /W/m,
  P0 = 9 W, length 2 m, NoRaman(), omega0 T0 = 1e6 (and 1e8 for the self-steepening check),
  fixed-step Float64 RK4IP. Input: A_k(0) of the laser exp(-tau^2/2) multiplied by
  a(w_k) exp(i phi(w_k)) on the 107 listed bins (w = k 2pi/70, |k| <= 53, exact integer match;
  the solver convention A(t) = sum_k A_k exp(-i w_k tau) equals claude-b's physics convention).
  Observables at xi = 2 normalized by the laser energy sum_k |A_laser,k|^2: eta_B (band
  w >= 10/3) and eta_G (after g = 1 - 0.5[tanh(tau + 15) - tanh(tau - 15)]).
