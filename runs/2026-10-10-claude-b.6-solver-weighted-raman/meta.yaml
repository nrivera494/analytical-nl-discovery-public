description: >-
  Same model, solver calls and conventions as run 2026-10-10-claude-b.6-solver-nd-check (nd_lib.jl and
  raman_bath_spectrum.jl are unchanged copies). Readout N_w = sum_k w_k n_k with the weights of
  weights_for_solver.json (claude-b, copied unchanged, sha256 534c46dc...11db): bins_k in claude-b's
  numpy convention; 'mirror' puts w_k on solver bin -k (claude-b's bins as claude-b applies them, the
  primary numbers), 'given' on solver bin +k. Signed weights are passed directly as the
  SpectralPhotonNumber filter (the observable and its adjoint terminal condition are linear in it).
  F_w = Var(N_w) / sum_k w_k^2 nbar_k; Var(N_w) from the input vacuum by
  solve_adjoint(...; adjoint_mode=:discrete_rk4ip), and with Raman the Langevin variance from the
  notebook contraction with the coth 300 K spectrum (trapezoid in z), reported separately as
  F_R = Var_R / sum w^2 nbar. Bandwidth ratio = var_in/var_out of the photon-number spectra over the
  whole grid (Omega T0 units, each about its own mean).
  (1) Kerr only: T0 = 1 ps, beta2 = 1 ps^2/m, gamma = 1 /W/m, omega0 T0 = 1e9 (s = 1e-9; residual
  O(s) below 2e-9 here), Nt 512 over 40 T0, 4000 steps; N10_zr0.7 and N20_zr0.3.
  (2) Physical fibre beta2 = 0.020 ps^2/m, gamma = 0.010 /W/m, T0 = 0.1 ps, N = 10, z = 0.7 z_wb:
  (2a) self-steepening suppressed (omega0 T0 = 1e6, the earlier B_noss), no Raman, Nt 512;
  (2b) self-steepening suppressed (omega0 T0 = 1e9), AgarwalRaman (fR 0.18, 12.2 fs, 32 fs), Nt 2048;
  (2c) self-steepening on (1550 nm) and AgarwalRaman, Nt 2048 (the earlier case C).
  In (2a) and (2b) photons are counted uniformly at hbar*omega0(1550 nm) (observable, nbar and input
  vacuum), and in (2b) the reservoir prefactor hbar*omega0/gamma uses the 1550 nm carrier, so the
  reservoir is normalized to physical photons at 1550 nm (choosing omega0_run for both the photon unit
  and the prefactor would give the same F_R, since F_R scales as omega_prefactor/omega_photon). In (2c)
  and (3) photons are counted at the physical frequency, 1/(hbar(omega0 + Omega)).
  (3) As (2c) at N = 20, z = 0.3 z_wb with the N20_zr0.3 weights.
  Raman cases repeated at Nt 4096 and 8192 (mirror side) and extrapolated in dt^2 (Richardson).
  F_R 'notebook' injects the noise as i gamma A m (squeezing notebook); 'ssweight' through the solver's
  (1 + Omega/omega0) * damped_freq_window (identical in (2b), where s = 1e-9).
