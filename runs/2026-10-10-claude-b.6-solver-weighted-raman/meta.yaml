convergence: >-
  (1) Kerr: 2000 steps and Nt 1024 change every F_w by <= 1.3e-11. Mirror vs given differ by <= 1.6e-9
  (O(s), s = 1e-9). Identity: with the given centroid weights, F_centroid / (var_in/var_out) - 1 =
  9.97e-7 (N10) and 9.41e-7 (N20); with the centroid weight extended to every grid bin (stage 1full),
  F_centroid = var_in/var_out to 2.2e-12 (N10) and 3.4e-14 (N20) at Nt 512 and 1024, 2000 and 4000
  steps. The 1e-6 offset is therefore the truncation of the weights to 282 (N10) / 237 (N20) bins:
  the output outside those bins carries 3.8e-8 / 2.4e-8 of sum (Omega - mean)^2 n, but its noise
  enters N_w at the 1e-6 level.
  (2b), (2c), (3): 2000 vs 4000 steps changes F_det by <= 1.1e-11 and F_R by <= 2.5e-10. The Raman
  kernel converges as dt^2: successive-difference ratios (Nt 2048/4096/8192) 3.89-4.03 for every
  quantity; Richardson values from (2048, 4096) and (4096, 8192) agree to <= 6.4e-7. Shift from Nt 2048
  to dt -> 0 (absolute): F_det up to 5.5e-4 (N20 binary, 0.5014727 -> 0.5009234; N20 eigvec
  0.0687281 -> 0.0689755), F_R up to 4.6e-5 (N10 binary, case 2c).
  The bandwidth ratio also moves with dt: (2b) 0.0350301, 0.0350116, 0.0350070 -> 0.0350054;
  (2c) 0.0352099, 0.0351913, 0.0351866 -> 0.0351851; (3) 0.0344704, 0.0344496, 0.0344444 -> 0.0344427
  (Nt 2048, 4096, 8192 -> dt^2 extrapolation).
  (2a) reproduces (1) N10 at omega0 T0 = 1e6 (centroid and eigvec to 2e-10; binary mirror/given
  0.4513348 / 0.4513368, the known O(s = 1e-6) split around the s -> 0 value 0.4513358).
