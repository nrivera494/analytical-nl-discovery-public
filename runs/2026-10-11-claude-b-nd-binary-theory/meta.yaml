serves: "Large-N behaviour of binary, non-negative and signed weighted readouts for a Gaussian in normal dispersion (C-20261010-claude-b-02 part d; T-20261010-claude-b-04 and -05)"
description: >-
  (1) adjoint_cov.py: discrete adjoint of the Strang split-step map (same model, grid and step rule as nd_cov.py of run
  2026-10-10-claude-b-nd-oracle) giving the spectral photon-count covariance C = G G^T / 4 from one batched backward pass
  over the kept bins. Validated at N10 z/z_wb = 0.7 against the finite-difference oracle: max |dC|/max|C| = 2.1e-9, same
  lambda_gen and binary F to 8 digits; 15 times faster. (2) big_points.py: N = 56, 80, 112 at z/z_wb = 0.7 and N = 56, 80
  at 1.0 (Nt 2048, 2048, 4096 over 40 T0; peak phase step 0.02): lambda_gen, parity-sector minima and parity bound of
  C-20261010-claude-a-03, centroid identity check, best interval, non-negative-weight heuristic, best binary filter
  (stage-1 search, refine_binary.refine, transfer from N = 40). big_search.py: harder search (transfers between large N,
  non-negative roundings, 8 x 2500-step ILS) changes the best binary F by 0.1-1.2%. (3) mode_anatomy.py, coarse_grain.py,
  fig_modes.py: structure of the optimal even and odd weighted readouts and their dependence on spectral resolution
  (piecewise-constant weights over blocks of b bins). (4) summarize.py: combines the oracle grid with these points, fits
  slopes, writes summary.json and fig_scaling.png.
