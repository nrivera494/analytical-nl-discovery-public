  1.000070; z/z_wb = 0.3 and 1.5 points up to 1.000078). N^2 lambda_gen = 3.554, 3.597, 3.638 at N = 56, 80, 112 (z/z_wb = 0.7), converging toward the centroid limit
  1/(2K) = 3.70 of C-20261010-claude-b-02. The adjoint is exact for the discrete map (validated against central differences).
