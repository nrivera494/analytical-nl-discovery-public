serves: "Raman reservoir floor on lambda_min, lambda_pass, lambda_gen, the centroid readout and binary filters for the Gaussian in normal dispersion (C-20261010-claude-b-01 and -02, relaxed-assumption check; T-20261010-claude-b-03 starts from here)"
description: >-
  Kerr-only mean field and noise map of the numpy oracle (run 2026-10-10-claude-b-nd-oracle) plus the Raman Langevin
  reservoir as multiplicative phase noise, dA = i gamma A m dz, with the symmetrized coth spectrum of raman_bath_spectrum.jl
  (Agarwal response f_R = 0.18, tau1 = 12.2 fs, tau2 = 32 fs, 300 K). In shot-noise units the injected covariance over
  d xi is 4 N^2 E R E^T d xi (E = local phase directions times |u|, R = circulant of the dimensionless spectrum
  c_hat(Omega) = |Im h_R(Omega/T0)| coth(hbar Omega/(2 k_B T T0))); V = J (I + W) J^T with W accumulated over slices
  (trapezoid, every 16 steps; every 4, 8, 16 steps agree to 3e-5 at N10). The deterministic delayed response is not included.
  Validation at N10 z/z_wb = 0.7, T0 = 100 fs against the solver (run 2026-10-10-claude-b.6-solver-weighted-raman, case 2b,
  which includes the deterministic response): Raman part F_R of the centroid weight 0.03594 vs 0.03580, of the lambda_gen
  eigenvector 0.03634 vs 0.03621, of the best binary filter 0.03240 vs 0.03401.
  Points: N10 z/z_wb = 0.7 (Nt 512; T0 = 50, 100, 300, 1000 fs), N20 at 0.7 (Nt 1024; T0 = 100, 1000 fs) and at 0.3 (T0 = 100 fs),
  all over 40 T0, peak phase step 0.02. Binary filters re-searched on the Raman-inclusive count covariance (stage-1 search with 20 random starts
  and 200 ILS steps, then refine_binary.refine).
