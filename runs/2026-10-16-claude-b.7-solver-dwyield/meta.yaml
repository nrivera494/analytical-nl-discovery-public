    where the DW packet sits at the gate edge); smooth-gate yield <= 2.4e-4. NSR peak level:
    -0.305 dB at delta3 = 0.02 (the DW spectrum carries fringes of period ~0.17-0.2 in w, about
    5 bins on G1, and the sampled fringe maximum depends on dw); <= 0.005 dB at the other delta3;
    peak frequency <= 0.025 in w. The fringe-averaged level (boxcar width 1 in w) agrees between G1 and G2
    to 0.002 dB (-27.581 vs -27.579 dB at delta3 = 0.02).
  item2: >-
    Step halving (G2, 4000 -> 8000): |relative change| <= 5.4e-7 (eta_B), <= 2.3e-5 (eta_DW),
    <= 2.1e-4 (smooth gate, at delta3 = 0.010). Grid G2 -> G3 at delta3 = 0.010 (8000 steps): eta_B
    -8.1e-3 (band-edge discretization; fractional-edge sums differ by 2.2e-5), eta_DW +2.6e-3 (hard-gate
    discretization at |tau| = 8), smooth-gate yield 5.9e-11, DW local-peak level 0.074 dB, peak w 0.008.
  item3: >-
    Step doubling (G2, base -> 2x steps): |relative change| <= 1.9e-6 for eta_B at all saved xi and
    for eta_DW(2), except N = 10: eta_B <= 2.9e-5, eta_DW(2) 7.4e-5. Window/grid: W512 (window 512,
    same dtau, same step) vs G2 for N = 6 and N = 8: eta_B <= 3.7e-4, eta_DW(2) <= 1.7e-5. N = 10:
    G3 vs G2 (40000 steps): eta_B <= 5.3e-4 (3.2e-6 at xi = 2) but eta_DW(2) -2.3 % and the smooth
    gate -2.5 % (G2 low): 2 % of the energy is at w >= 32, whose group delay over xi ~ 2 exceeds
    243 T0 and wraps into the |tau| < 8 gate on the 256 T0 window. Window 1024 T0 (Nt 65536, same
    dtau, 20000 steps): eta_DW(2) = 0.275620, eta_DW_smoothgate(2) = 0.270969; G3 (384 T0) differs from it
    by 9.4e-5 and G2 by -2.3 %; eta_B(2) agrees to 7.6e-6 on all three windows; eta_B at xi = 0.5-1.5
    differs by up to 1.2e-3 between windows (band-edge discretization: w_z = 3.33 lies inside the broad
    spectrum). For N = 10 the reported eta_DW(2) is therefore the 1024 T0 value.
  item4: >-
    Step halving (G1, 4000 -> 8000): <= 3.0e-6. Raman kernel / time step 1.95 -> 0.98 -> 0.49 fs
    (window fixed, 8000 steps): eta_B +6.97e-3 then +1.73e-3 (delta3 0.02), +3.47e-3 then +8.6e-4 (0.03),
    +1.78e-3 then +4.4e-4 (0.04): ratios 4.0, i.e. second order in dt (the kernel is sampled at the grid
    step and h_R(0) = 0, so the quadrature error is O(dt^2)). Richardson-extrapolated eta_B: 9.267e-6,
    2.6843e-3, 1.6130e-2; eta_DW: 2.7196e-5, 2.6307e-3, 1.5736e-2. NSR levels change <= 0.036 dB, peak
    frequency unchanged.
invariants: >-
  Energy: relative drift <= 2.2e-10 (item 1, 8000 steps; 5.5e-9 at 4000 steps, ratio 26, about 4th order),
  <= 2.2e-10 (item 2), <= 3.9e-8 (item 3). Momentum <w>: drift 0.6e-5 to 1.9e-4 and Hamiltonian
  relative drift 1e-7 to 1.1e-4, independent of the step; both scale as s = 1/(omega0 T0): at
  delta3 = 0.04 (item 1) dP = 1.45e-5, 1.45e-6, 1.43e-7 and dH = 1.37e-5, 1.37e-6, 1.36e-7 for
  omega0 T0 = 1e6, 1e7, 1e8, so they are the suppressed self-steepening, not integration error;
  eta_B changes by 2.0e-5 relative between s = 1e-6 and 1e-8. delta3 = 0 reference (pure NLSE):
  dP = 6.2e-6 (also s), dH 7e-10. Raman (M1): <w> moves by -3.77, -3.32, -2.90 (soliton
  self-frequency shift) and the energy drift equals s * Delta<w> (-3.77e-6, -3.32e-6, -2.90e-6):
  the (omega0 + Omega) prefactor conserves photon number, not energy; H is not conserved with Raman.
findings_and_caveats:
  - "Hard gate leakage. Zeroing |tau| < 8 cuts the soliton's exponential tail (and any radiation) at |tau| = 8 and leaks broadband energy into the band. Floor from the input sech and from the delta3 = 0 reference at xi = 4: eta_DW = 4.3e-9 (band of delta3 = 0.010) to 1.3e-8 (0.030). At xi = 4 the hard-gated yield exceeds the smooth-gate yield by 7.1 % (delta3 0.014), 0.8 % (0.016), <= 0.1 % (>= 0.020), but by 3.1x (0.012) and 309x (0.010): there the hard-gated number is not a DW yield. The smooth-gate floor is <= 2.4e-17 (delta3 = 0 reference, bands of delta3 <= 0.020)."
  - "DW bursts and timing of xi = 4 (stage item2_xi). The N = 2 breather compresses at xi = 0.80, 2.40 and 3.95 (peak power 4.0-4.4 P0, xi resolution 0.05); the band yield jumps at each compression and plateaus in between: delta3 = 0.020: 9.34e-4 then 1.760e-3; 0.016: 2.09e-5 then 4.30e-5; 0.012: 2.16e-8 then 4.42e-8. At xi = 4 the third burst is still under the |tau| < 8 gate, so eta_DW(4) counts two bursts; the smooth-gate eta_DW(4) equals the inter-compression plateau to <= 2e-4. eta_B(4) is taken 0.05 after the third compression and is dominated by the compressed soliton's spectral wing at the band edge for delta3 <= 0.02 (e.g. 7.0e-3 vs DW plateau 1.76e-3 at delta3 = 0.020; 7.9e-5 vs 4.4e-8 at 0.012)."
  - "Band-edge discretization. eta_B sums whole bins with w_k >= w_z; where the spectrum is steep at w_z the result depends on dw at the 0.1-1 % level (G1 vs G2 at delta3 = 0.02: 0.46 %; G2 vs G3 at 0.010: 0.81 %; mask runs TW 70 vs 280: 0.2 %). A fractional-edge sum (bin straddling w_z weighted by its fraction above w_z) removes this to <= 3e-5 and is given in summary.json for the saved spectra. Codes on different grids should be compared with that sum or on the same grid."
  - "NSR peak sampling. For delta3 = 0.02 the DW spectrum has fringes of period ~0.17-0.2 in w (two bursts); the grid maximum depends on dw by 0.3 dB (G1 -23.36 dB, G2 -23.06 dB re input maximum). The fringe-averaged level (boxcar width 1 in w) is -27.58 dB on both grids."
  - "Hard gate where the DW sits near |tau| = 8: item 1 delta3 = 0.10 and 0.06 (DW delay xi/(4 delta3) = 10 and 17) and item 3 N = 3, delta3 = 0.05 give eta_DW > eta_B (0.197 vs 0.167; 0.1148 vs 0.1142; 0.1668 vs 0.1647); the smooth gate gives 0.1645, 0.1095, 0.1375."
  - "Raman (M1). The Raman-shifted soliton is at tau = 12 (mean frequency -3.8 to -2.9) at xi = 4, outside the gate, so the hard-gated eta_DW at delta3 = 0.02 (2.70e-5) is dominated by leakage from the soliton's leading tail; eta_B = 9.27e-6 (Richardson) and the smooth-gate yield 9.26e-6 are the DW energy. Raman lowers eta_B(4) relative to M0 by 750x (delta3 0.02), 10x (0.03), 3.9x (0.04); since M0 eta_B(4) at delta3 = 0.02 is dominated by the breathing soliton wing, the smooth-gated ratio there (190x) is the DW comparison."
  - "Solver specifics that a numpy split-step code does not share: (i) residual self-steepening s = 1/(omega0 T0) = 1e-6 shifts yields by ~1-2e-5 relative (measured: eta_B 2.0e-5 at delta3 = 0.04; 1.0-1.3e-5 in the mask runs) and causes the momentum/Hamiltonian drifts; (ii) damped_freq_window tapers the nonlinear term at positive (blue) detunings above ~0.85 of Nyquist; the output spectrum above 0.8 of Nyquist is <= -135.9 dB re its maximum in every saved plane of every run, so it plays no role here; (iii) spectra are A_k = fftshift(ifft(A(t))) with A(t) = sum_k A_k exp(-i w_k tau), so a numpy code using np.fft.fft for time -> frequency has w reversed."
  - "Window criterion. The suggested window >= 2 (xi/(4 delta3) + 15) covers the DW at 1/(2 delta3) only; at N = 10 (Gaussian, delta3 = 0.05) the phase-matched DWs reach w ~ 32 with delays > 240 T0 at xi = 2 and the gated yield needs >= 384 T0."
