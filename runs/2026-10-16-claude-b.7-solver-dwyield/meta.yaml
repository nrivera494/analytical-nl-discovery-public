convention_check: >-
  stage lin (gamma = 0, delta3 = 0.05, xi = 0.05, G1): A_k(xi)/A_k(0) = exp(i D(w_k) xi) with
  D = delta3 w^3 - w^2/2 to max abs error 1.19e-6 over 2305 bins (|w| <= 45.2, |D xi| up to 283 rad;
  consistent with FFT round-off in the weakest tested bins, threshold 1e-20 of the spectral maximum); the alternatives
  -delta3 w^3 - w^2/2 (flipped axis or beta3 sign), -D, and 6 delta3 w^3 - w^2/2 (missing 1/6) all give
  errors of 2.0. A field exp(-tau^2/2 - 5 i tau) peaks at w = +4.987 (nearest bin to +5), so the solver's
  A(t) = sum_k A_k exp(-i w_k tau), A_k = fftshift(ifft(A(t))). A packet at w1 = 10 (delta3 = 0.05) is
  delayed to tau = 10.017 after xi = 2 (D'(w1) xi = 10.000; +0.017 is the TOD shift of the centroid
  for its bandwidth), i.e. positive delay = trailing. No surprises: TaylorBeta uses beta_k Omega^k / k!.
