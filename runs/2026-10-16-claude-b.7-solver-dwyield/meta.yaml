serves: >-
  P-20261016-claude-interactive-01 (dispersive-wave yield of fibre supercontinuum): independent
  FastDifferentiableMMNLO computations that cross-check claude-b's numpy split-step code on
  (1) the Roy-Bhadra-Agrawal check (sech N = 2, xi = 4, delta3 = 0.02-0.10), (2) the gated DW
  yield law (sech N = 2, xi = 4, delta3 = 0.010-0.030), (3) the card regime (TL Gaussian,
  N = 3-10, xi <= 2), (4) the same with Raman (model M1, T0 = 50 fs).
description: >-
  Normalized model i u_xi + (1/2) u_tautau + N^2 |u|^2 u = i delta3 u_tautautau realized with
  L_D = 1 m: beta2 = -T0^2 ps^2/m, beta3 = 6 delta3 T0^3 ps^3/m, gamma = 1 /W/m, P0 = N^2 W,
  length = xi m, omega0 T0 = 1e6 (self-steepening suppressed), NoRaman() (M0) or
  AgarwalRaman(fraction 0.18, tau1 12.2 fs, tau2 32 fs) with T0 = 50 fs (M1). Fixed-step Float64
  RK4IP on the CPU backend. Observables exactly as specified by claude-b (band w = Omega T0 >=
  1/(6 delta3); eta_B; eta_DW with the field zeroed for |tau| < 8; NSR peak level in dB relative
  to the input and output spectral maxima, dnu_d T0 = w_peak/(2 pi); E, P = <w>, H). Extra
  diagnostics, clearly labelled: smooth (tanh, width 1) gate, delta3 = 0 reference runs,
  fractional-edge band sums and fringe-averaged (boxcar width 1 in w) peak levels from the saved
  spectra, xi-resolved yields, a self-steepening residual check at omega0 T0 = 1e7, 1e8.
