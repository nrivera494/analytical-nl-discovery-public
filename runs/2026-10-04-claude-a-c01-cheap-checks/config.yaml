# Config for run 2026-10-04-claude-a-c01-cheap-checks. Everything is in check.py; this file lists the knobs.
command: "~/agent-work/venv/bin/python check.py <output_dir>"
python: "3.9 (agent-work venv): sympy 1.14.0, mpmath 1.3.0, numpy 2.0.2, scipy 1.13.1, matplotlib 3.9.4"
mp_dps: 30
symbolic_l_range: [0, 6]          # A2, A3: Legendre separation and Pöschl–Teller residuals
