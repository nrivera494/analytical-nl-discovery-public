uncertainty_grid: {mu: [0.05, 0.3, 0.6, 0.9, 0.9375, 0.99], mu0: [0, -0.5], eps: [0.1, 0.02], delta: [1.0e-2, 1.0e-4]}
linear_limit: {eps_ref: 0.05, zeta_ref: 2.0, power_ratios: [1.0e-2, 1.0e-4, 1.0e-6], delta: 1.0e-3}
prediction_grids:
  main_zeta: [0.25, 0.5, 1.0, 2.0, 3.0, zeta_star, 6.0, 8.0, 10.0]
  heldout_zeta: [0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
  finite_eps: [0.1, 0.05, 0.025, 0.0125]
  finite_eps_zeta: [1.0, 2.0, zeta_star, 8.0]
  edge_cutoff_illustration: "delta = eps^(2/3) (constant c = 1; c is not predicted)"
