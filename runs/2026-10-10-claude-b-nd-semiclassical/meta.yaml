description: >-
  Reduced semiclassical computation of the amplitude-to-scaled-phase map C_Z for the unchirped Gaussian: central
  differences of the full NLSE at large N on the span of the first M Hermite functions (eta = 1e-6), output read as
  Ytilde = Im(du exp(-i arg u))/N with sqrt(dtau) weights; Lambda = 1/sigma_1^2, Pi = 1/sigma_2^2; sigma_1 of the
  amplitude block A; mean-field <omega^2>_out, int rho^2 (for K(Z)). sigma_c.py: table at Z = 0.1..1.59, N = 20, 50, 100,
  M = 40 (summary.json; M = 40 is biased by ~5e-3 at Z = 0.1, see curve files). lambda_curve.py: one propagation records
  the curve every 0.01 in Z up to 3.3 and at the exact Z of every oracle point: curve_N50.json (Nt 2048, M 80, phase step
  0.02), curve_N50_fine.json (phase step 0.01), curve_N100.json (Nt 4096), curve_N200.json (Nt 8192), all over 40 T0.
