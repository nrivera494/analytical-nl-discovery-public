# Run 2026-10-16-claude-interactive.7-exact-vs-twa-4mode: exact quantum dynamics against truncated Wigner (TWA) for 4 modes
# with linear energies (0, 1, 1, 2) and the resonant Kerr Hamiltonian H = (g/2) sum_res R_pqrs a+_p a+_q a_r a_s, g = 1/n
# (L_NL = 1 for the total photon number n). Coherent input with mode powers n*frac and phases (0, 0.7, 1.9, 2.6); z up to 6 sqrt(n).
# Observables of the fundamental: coh_0 = |<a_0>|^2/<n_0> and the Fano factor Var(n_0)/<n_0>.
# Exact: N and Q = n_1a + n_1b + 2 n_2 are conserved; every (N, Q) sector with weight above 1e-11 is diagonalized
# (captured norm in summary.json). TWA: 20000 trajectories, RK4 with dz = 0.02, jackknife errors over 10 blocks;
# 'weyl' integrates the Weyl symbol (adds -g T A with T_qs = sum_p R_pqps), 'bare' the classical Hamiltonian only.
# Sign convention: exact evolution exp(+iHz), matching dA/dz = +i dH/dA* of the TWA codes. The first version used exp(-iHz);
# its outputs were discarded (an n-independent lag of the Fano dip exposed it) and every case was rerun after the fix.
exact_vs_twa.py: "random-tensor toy: resonant_model.build(3, 400, 0) restricted to mode 0, the first two group-1 modes and the first group-2 mode; exchange couplings about 0.02 of the self/cross-phase couplings"
exact_vs_twa_grin.py: "exact GRIN Hermite-Gauss tensor (grin_overlaps.grin_tensor(3), S_0000 = 1) restricted to HG00, HG01, HG10, HG02; exchange couplings +-0.18"
cases:
  mixing55: "toy, frac (0.55, 0.15, 0.15, 0.15), n = 16, 25, 36"
  condensate85: "toy, frac (0.85, 0.05, 0.05, 0.05), n = 16, 36, 64, 100"
  grin4_mixing55: "GRIN subset, frac (0.55, 0.15, 0.15, 0.15), n = 16, 25, 36"
summarize.py: "summary.json and summary.txt; adds the closed forms of coh_0 for self/cross-phase-only dynamics, exact and in TWA"
fig_exact_vs_twa.py: "fig_exact_vs_twa.png (GRIN subset coh_0 and Fano factor; max |coh_exact - coh_TWA| against n)"
ordering_term.py: "ordering_term.txt: size of the Weyl-ordering term omitted by the large-n TWA runs"
commands:
  - "~/agent-work/venv/bin/python -W ignore exact_vs_twa.py mixing55 0.55,0.15,0.15,0.15 16 25 36"
  - "~/agent-work/venv/bin/python -W ignore exact_vs_twa.py condensate85 0.85,0.05,0.05,0.05 16 36 64 100"
  - "~/agent-work/venv/bin/python -W ignore exact_vs_twa_grin.py mixing55 0.55,0.15,0.15,0.15 16 25 36"
  - "~/agent-work/venv/bin/python -W ignore summarize.py > summary.txt"
  - "~/agent-work/venv/bin/python -W ignore fig_exact_vs_twa.py"
  - "~/agent-work/venv/bin/python -W ignore ordering_term.py"
