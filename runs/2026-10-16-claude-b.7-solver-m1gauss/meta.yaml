stages_added_during_the_run: >-
  q32k/q32kb/q32kc/q32kd (32000 steps at all four delta3) after the 4000 -> 8000 -> 16000 changes at
  delta3 = 0.0055 (+1.25e-4, +1.53e-4) did not shrink; dtA-dtD (Nt 65536, dt 0.195 fs, 8000 steps) to
  measure the Raman-kernel/time-step dependence at every delta3. Commands as above with these stage names.
results: >-
  eta_G(xi = 2) [window 256 T0, Nt 32768, dt 0.39 fs, 32000 steps]: 1.01424e-13 (delta3 0.0055),
  2.79601e-12 (0.006), 7.52142e-11 (0.0066), 1.71830e-9 (0.0073); eta_B: 1.02255e-13, 2.80028e-12,
  7.52356e-11, 1.71840e-9. Gated DW spectral peak at w = 92.11, 84.53, 76.97, 69.70 (1/(2 delta3) =
  90.9, 83.3, 75.8, 68.5); essentially all gated band energy lies in [0.8, 1.2] w_DW (rest <= 1e-7
  relative). The DW is emitted before xi = 1: eta_G(1)/eta_G(2) - 1 = -9e-8 (delta3 0.0055). At xi = 2 the
  Raman solitons have <w> = -7.82 ... -7.42 and peak at tau = 12.1, inside the |tau| < 15 gate.
convergence: >-
  Steps (relchange A_vs_B = X(A)/X(B) - 1): n8000 vs n32000 = +1.67e-4, +9.6e-5, +5.1e-5, +2.6e-5
  (delta3 0.0055 ... 0.0073). Sequence 4000 -> 8000 -> 16000 -> 32000: delta3 0.0055 changes +1.25e-4,
  +1.53e-4, +1.34e-5 (pre-asymptotic, then converging); delta3 0.0073: +1.90e-4, +2.38e-5, +1.79e-6
  (ratios 8.0, 13.3, approaching 4th order). Window 256 -> 512 T0 (same dtau, 8000 steps, delta3 0.0055):
  eta_G 3.4e-10, eta_B 4.1e-5. Raman kernel / time step 0.39 -> 0.195 fs (Nt 65536, 8000 steps):
  eta_G -5.63e-4, -5.15e-4, -4.67e-4, -4.20e-4 (smooth in delta3; the second-order behaviour seen in
  run 2026-10-16-claude-b.7-solver-dwyield item 4 implies the 0.195 fs values are within ~2e-4 of dt -> 0).
fit: >-
  ln eta_G = c + p ln delta3 - d/delta3, least squares on the four 32000-step values: d = 0.235960,
  p = -2.9703, c = -2.4721; residuals in ln eta +1.7e-5, -4.7e-5, +4.5e-5, -1.5e-5; formal standard
  error of d 4.9e-5 (1 degree of freedom), corr(p, d) = -0.99912, condition number of the design 1.5e5;
  sensitivities dd/dln(eta_i) = -0.367, +0.337, +0.375, -0.345. Numerical robustness of d: 8000 steps
  0.235941, 4000 steps 0.236058, dt 0.195 fs (8000 steps) 0.235938, 32000 steps times the measured
  dt-refinement factor 0.235957 (0.235956 with dt^2 extrapolation). So d = 0.23596 with numerical
  uncertainty ~2e-5 and fit uncertainty ~5e-5. With p fixed at 0: d = 0.21722 (rms residual 0.013);
  the same 3-parameter fit to eta_B gives d = 0.23357, p = -2.619.
floors: >-
  eta_G at xi = 0: 1.0e-33 (all four). delta3 = 0 reference (same Raman/N = 3 dynamics without the TOD
  resonance), eta_G at xi = 2 with the four band edges: 2.6e-18, 1.4e-17, 7.5e-17, 3.7e-16, i.e. 4.6 to
  6.7 decades below the yields; its gated band energy sits at the band edge (soliton blue wing through
  the gate edges), and its gated energy in the DW window is 1e-30 to 2e-25.
