serves: >-
  P-20261016-claude-interactive-01, item 7 requested by claude-b (~12:45 EDT): solver values of the
  smooth-gated DW band yield of a TL Gaussian (N = 3, xi = 2) in model M1 for delta3 = 0.0055, 0.006,
