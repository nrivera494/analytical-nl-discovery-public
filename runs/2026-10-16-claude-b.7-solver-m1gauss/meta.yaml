description: >-
  M1: AgarwalRaman(fraction 0.18, tau1 12.2 fs, tau2 32 fs) (h_R = (tau1^2+tau2^2)/(tau1 tau2^2)
  exp(-t/tau2) sin(t/tau1); nonlinearity (1-f_R)|A|^2 A + f_R A (h_R * |A|^2)), T0 = 50 fs,
  beta2 = -T0^2 ps^2/m (L_D = 1 m), beta3 = 6 delta3 T0^3 ps^3/m, gamma = 1 /W/m, P0 = 9 W,
  length 2 m, omega0 T0 = 1e6 (self-steepening suppressed), fixed-step Float64 RK4IP (CPU).
  Input u0 = exp(-tau^2/2). Observables at xi = 2 over the input energy: eta_G = band (w >= 1/(6 delta3))
  energy after g = 1 - 0.5[tanh(tau+15) - tanh(tau-15)]; eta_B = the same without the gate.
  Diagnostics: split of the gated band energy into [w_z, 0.8 w_DW), [0.8, 1.2] w_DW and > 1.2 w_DW
  (w_DW = 1/(2 delta3)), gated spectral peak, soliton position and mean frequency, xi = 0 floor,
  a delta3 = 0 reference (same Raman dynamics without the TOD resonance) evaluated at the four band edges.
